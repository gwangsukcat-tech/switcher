<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#dff1ff">
<title>우리집 불 리모컨</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Jua&display=swap" rel="stylesheet">
<style>
  :root {
    color-scheme: light;
    --sky: #dff1ff;
    --blush-bg: #ffeaf3;
    --card: #ffffff;
    --ink: #3a3358;
    --muted: #76709a;
    --sun: #ffd84d;
    --lav: #cfd5ff;
    --pink: #ffb9d2;
    --mint: #b9f0d6;
    --err: #c81e44;
    --focus: #2b6fff;
    box-sizing: border-box;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body {
    min-height: 100vh;
    min-height: 100dvh;
    color: var(--ink);
    font-family: "Jua", "Apple SD Gothic Neo", "Noto Sans KR", "Malgun Gothic", sans-serif;
    line-height: 1.5;
    background-color: var(--sky);
    background-image:
      radial-gradient(circle, rgba(255,255,255,0.85) 3px, transparent 3.5px),
      linear-gradient(180deg, var(--sky) 0%, var(--blush-bg) 100%);
    background-size: 34px 34px, 100% 100%;
    padding: calc(env(safe-area-inset-top, 0px) + 20px) 16px calc(env(safe-area-inset-bottom, 0px) + 28px);
    display: flex;
    justify-content: center;
    position: relative;
    overflow-x: hidden;
  }
  body::before {
    content: "";
    position: fixed; inset: 0;
    background: radial-gradient(ellipse 100% 55% at 50% 0%, rgba(255, 224, 102, 0.7), rgba(255, 224, 102, 0) 75%);
    opacity: 0;
    transition: opacity 0.6s ease;
    pointer-events: none;
  }
  body[data-lit="1"]::before { opacity: 1; }

  main { position: relative; width: 100%; max-width: 420px; }

  header { text-align: center; margin: 4px 0 18px; }
  h1 { margin: 0; font-size: 2rem; font-weight: 400; letter-spacing: -0.01em; }
  .sub { margin: 2px 0 0; color: var(--muted); font-size: 1rem; }

  button { font: inherit; color: inherit; cursor: pointer; }
  button:focus-visible, input:focus-visible, summary:focus-visible {
    outline: 4px solid var(--focus);
    outline-offset: 3px;
  }
  button:disabled { cursor: not-allowed; }

  /* 스티커 느낌: 굵은 테두리와 납작한 그림자 */
  .sticker {
    border: 3px solid var(--ink);
    box-shadow: 0 5px 0 var(--ink);
  }

  .connect-card { display: grid; gap: 8px; margin-bottom: 20px; }
  .connect {
    display: flex; align-items: center; justify-content: center; gap: 10px;
    min-height: 58px;
    border-radius: 999px;
    background: var(--pink);
    font-size: 1.25rem;
    transition: transform 0.08s, box-shadow 0.08s, background 0.3s;
  }
  .connect:active:not(:disabled) { transform: translateY(4px); box-shadow: 0 1px 0 var(--ink); }
  .connect[aria-pressed="true"] { background: var(--mint); }
  .heart { font-size: 1.2rem; color: #ffffff; text-shadow: 0 0 0 var(--ink); -webkit-text-stroke: 1.5px var(--ink); transition: color 0.3s; }
  .connect[aria-pressed="true"] .heart { color: #ff5c8a; }

  .status { margin: 4px 6px 0; min-height: 1.5em; color: var(--muted); font-size: 1rem; text-align: center; }
  .status.error { color: var(--err); }
  .link {
    border: 0; background: none; padding: 6px; color: var(--muted);
    font-size: 0.9rem; text-decoration: underline; justify-self: center;
  }

  .plate {
    background: var(--card);
    border-radius: 32px;
    padding: 14px;
    display: grid;
    gap: 14px;
  }

  .row {
    display: grid;
    grid-template-columns: 116px 1fr;
    gap: 12px;
    align-items: center;
    padding: 12px 10px;
    border-radius: 24px;
    background: #f6f4ff;
    border: 2.5px dashed #b8b2e0;
  }
  .row[hidden] { display: none; }

  .lamp { display: grid; justify-items: center; gap: 4px; text-align: center; }
  .lamp-name { font-size: 1.05rem; }
  .lamp-last { font-size: 0.82rem; color: var(--muted); min-height: 2.6em; }

  /* 얼굴 있는 전구 */
  .bulb { width: 84px; height: 104px; overflow: visible; }
  .bulb .glass { fill: #e8eaff; stroke: var(--ink); stroke-width: 3; stroke-linejoin: round; transition: fill 0.35s; }
  .bulb .cap { fill: #b9b4d8; stroke: var(--ink); stroke-width: 3; stroke-linejoin: round; }
  .bulb .face { fill: none; stroke: var(--ink); stroke-width: 3; stroke-linecap: round; }
  .bulb .dot-eye { fill: var(--ink); stroke: none; }
  .bulb .shine { fill: #ffffff; stroke: none; }
  .bulb .blush { fill: #ffa3c2; opacity: 0.8; stroke: none; }
  .bulb .sparkles path { fill: #ffb400; stroke: var(--ink); stroke-width: 2; stroke-linejoin: round; }
  .bulb .zz text { fill: var(--muted); font-family: "Jua", sans-serif; font-size: 18px; }

  .bulb .eyes-open, .bulb .mouth-on, .bulb .sparkles { display: none; }
  .bulb.lit .eyes-open, .bulb.lit .mouth-on, .bulb.lit .sparkles { display: inline; }
  .bulb.lit .eyes-closed, .bulb.lit .mouth-off, .bulb.lit .zz { display: none; }
  .bulb.lit .glass { fill: #ffe566; }
  .bulb.lit { filter: drop-shadow(0 0 12px rgba(255, 200, 40, 0.9)); animation: hop 0.5s ease-out; }
  @keyframes hop { 0% { transform: translateY(0); } 40% { transform: translateY(-8px); } 100% { transform: translateY(0); } }
  .bulb.lit .sparkles path { animation: twinkle 1.6s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
  .bulb.lit .sparkles path:nth-child(2) { animation-delay: 0.5s; }
  .bulb.lit .sparkles path:nth-child(3) { animation-delay: 1s; }
  @keyframes twinkle { 0%, 100% { transform: scale(1); opacity: 1; } 50% { transform: scale(0.6); opacity: 0.7; } }

  .rocker { display: grid; gap: 10px; }
  .half {
    min-height: 62px;
    border-radius: 20px;
    font-size: 1.35rem;
    transition: transform 0.08s, box-shadow 0.08s, opacity 0.2s;
  }
  .half.on { background: var(--sun); }
  .half.off { background: var(--lav); }
  .half:active:not(:disabled) { transform: translateY(4px); box-shadow: 0 1px 0 var(--ink); }
  .half:disabled { opacity: 0.5; box-shadow: 0 3px 0 var(--ink); }
  .half.sent { filter: brightness(1.08); }

  .opts { display: grid; gap: 2px; padding: 6px 8px 2px; }
  .opts label { display: flex; align-items: center; gap: 12px; min-height: 46px; font-size: 1.05rem; }
  .opts input { width: 24px; height: 24px; accent-color: #ff6f9f; }

  details { margin: 14px 4px 0; font-size: 0.95rem; color: var(--muted); }
  summary { cursor: pointer; padding: 8px 0; }
  pre {
    margin: 6px 0 0; padding: 12px; border-radius: 16px;
    border: 2.5px solid var(--ink); background: #ffffff;
    max-height: 190px; overflow: auto; white-space: pre-wrap; word-break: break-all;
    font-family: ui-monospace, Menlo, Consolas, monospace;
    font-size: 0.78rem; color: var(--ink);
  }
  .note { margin: 16px 8px 0; color: var(--muted); font-size: 0.88rem; text-align: center; }

  @media (prefers-reduced-motion: reduce) {
    body::before, .bulb .glass, .connect, .half, .heart { transition: none; }
    .bulb.lit, .bulb.lit .sparkles path { animation: none; }
  }
</style>
</head>
<body data-lit="0">
<main>
  <header>
    <h1>우리집 불 리모컨</h1>
    <p class="sub">I/O 스위처로 불을 켜고 꺼요</p>
  </header>

  <section class="connect-card">
    <button id="connectBtn" class="connect sticker" type="button" aria-pressed="false">
      <span class="heart" aria-hidden="true">♥</span>
      <span id="connectLabel">스위처 연결</span>
    </button>
    <p id="status" class="status" role="status" aria-live="polite">버튼을 눌러서 SWITCHER_M을 찾아보세요.</p>
    <button id="allBtn" class="link" type="button">목록에 기기가 안 보이면: 모든 블루투스 기기 보기</button>
  </section>

  <section class="plate sticker" aria-label="스위치">
    <div class="row" id="row1">
      <div class="lamp">
        <div class="bulb-slot" id="slot1"></div>
        <div class="lamp-name">스위치 1</div>
        <div class="lamp-last" id="last1">아직 명령을 안 보냈어요</div>
      </div>
      <div class="rocker">
        <button class="half on sticker" type="button" data-sw="1" data-act="on" disabled>켜기</button>
        <button class="half off sticker" type="button" data-sw="1" data-act="off" disabled>끄기</button>
      </div>
    </div>

    <div class="row" id="row2" hidden>
      <div class="lamp">
        <div class="bulb-slot" id="slot2"></div>
        <div class="lamp-name">스위치 2</div>
        <div class="lamp-last" id="last2">아직 명령을 안 보냈어요</div>
      </div>
      <div class="rocker">
        <button class="half on sticker" type="button" data-sw="2" data-act="on" disabled>켜기</button>
        <button class="half off sticker" type="button" data-sw="2" data-act="off" disabled>끄기</button>
      </div>
    </div>

    <div class="opts">
      <label><input type="checkbox" id="two"> 2구 스위처예요</label>
      <label><input type="checkbox" id="invert"> 켜기와 끄기가 반대로 동작해요</label>
    </div>
  </section>

  <details>
    <summary>통신 기록</summary>
    <pre id="log">아직 기록이 없어요.</pre>
  </details>

  <p class="note">전구는 마지막으로 보낸 명령을 보여줘요. 벽 스위치나 예약으로 바뀐 실제 상태는 알 수 없어요. 아이폰에서는 사파리가 아니라 Bluefy 같은 웹 블루투스 브라우저에서 열어야 해요.</p>
</main>

<template id="bulbTpl">
  <svg class="bulb" viewBox="0 0 100 124" aria-hidden="true">
    <g class="sparkles">
      <path d="M12 30 l3 7 7 3 -7 3 -3 7 -3 -7 -7 -3 7 -3z"/>
      <path d="M88 22 l2.5 6 6 2.5 -6 2.5 -2.5 6 -2.5 -6 -6 -2.5 6 -2.5z"/>
      <path d="M90 74 l2 5 5 2 -5 2 -2 5 -2 -5 -5 -2 5 -2z"/>
    </g>
    <g class="zz"><text x="78" y="20">z</text><text x="88" y="8">z</text></g>
    <path class="glass" d="M50 8 C28 8 14 24 14 44 c0 12 6 20 12 28 c4 5 6 9 6 14 v6 h36 v-6 c0-5 2-9 6-14 c6-8 12-16 12-28 C86 24 72 8 50 8z"/>
    <rect class="cap" x="34" y="92" width="32" height="9" rx="4.5"/>
    <rect class="cap" x="38" y="103" width="24" height="9" rx="4.5"/>
    <path class="cap" d="M44 113 h12 l-2 7 h-8z"/>
    <ellipse class="blush" cx="29" cy="62" rx="6.5" ry="4"/>
    <ellipse class="blush" cx="71" cy="62" rx="6.5" ry="4"/>
    <g class="eyes-closed face"><path d="M33 52 q5.5 5 11 0"/><path d="M56 52 q5.5 5 11 0"/></g>
    <g class="eyes-open"><circle class="dot-eye" cx="39" cy="51" r="5"/><circle class="dot-eye" cx="61" cy="51" r="5"/><circle class="shine" cx="40.8" cy="49.2" r="1.8"/><circle class="shine" cx="62.8" cy="49.2" r="1.8"/></g>
    <path class="mouth-off face" d="M46 64 h8"/>
    <path class="mouth-on face" d="M41 61 q9 11 18 0"/>
  </svg>
</template>

<script>
(function () {
  var SERVICE = "0000150b-0000-1000-8000-00805f9b34fb";
  var CHAR = "000015ba-0000-1000-8000-00805f9b34fb";
  // 스위치 1: 켜기 00 / 끄기 01, 스위치 2: 켜기 05 / 끄기 03
  var KEYS = { 1: { on: 0x00, off: 0x01 }, 2: { on: 0x05, off: 0x03 } };

  var device = null, ch = null, busy = false;
  var lit = { 1: false, 2: false };

  var $ = function (id) { return document.getElementById(id); };
  var statusEl = $("status"), logEl = $("log");
  var connectBtn = $("connectBtn"), connectLabel = $("connectLabel"), allBtn = $("allBtn");
  var twoEl = $("two"), invertEl = $("invert");
  var halves = Array.prototype.slice.call(document.querySelectorAll(".half"));
  var logLines = [];
  var bulbs = {};

  [1, 2].forEach(function (n) {
    var slot = $("slot" + n);
    slot.appendChild(document.getElementById("bulbTpl").content.cloneNode(true));
    bulbs[n] = slot.querySelector(".bulb");
  });

  window.addEventListener("error", function (ev) {
    setStatus("페이지 오류: " + ev.message, true);
  });
  window.addEventListener("unhandledrejection", function (ev) {
    var r = ev.reason;
    setStatus("오류: " + (r && r.name ? r.name + " - " : "") + (r && r.message ? r.message : r), true);
  });

  function setStatus(text, isError) {
    statusEl.textContent = text;
    statusEl.className = "status" + (isError ? " error" : "");
  }
  function log(text) {
    var t = new Date().toLocaleTimeString("ko-KR", { hour12: false });
    logLines.push(t + "  " + text);
    if (logLines.length > 60) logLines.shift();
    logEl.textContent = logLines.join("\n");
    logEl.scrollTop = logEl.scrollHeight;
  }

  function store(key, val) { try { localStorage.setItem(key, val); } catch (e) {} }
  function load(key) { try { return localStorage.getItem(key); } catch (e) { return null; } }

  function updateLitFlag() {
    document.body.setAttribute("data-lit", (lit[1] || (twoEl.checked && lit[2])) ? "1" : "0");
  }
  function applyType() { $("row2").hidden = !twoEl.checked; updateLitFlag(); }
  twoEl.checked = load("io_two") === "1";
  invertEl.checked = load("io_invert") === "1";
  applyType();
  twoEl.addEventListener("change", function () { store("io_two", twoEl.checked ? "1" : "0"); applyType(); });
  invertEl.addEventListener("change", function () { store("io_invert", invertEl.checked ? "1" : "0"); });

  function setControls(enabled) {
    halves.forEach(function (b) { b.disabled = !enabled; });
  }
  function setConnected(on) {
    connectBtn.setAttribute("aria-pressed", on ? "true" : "false");
    connectLabel.textContent = on ? "연결됨" : "스위처 연결";
    setControls(on && !busy);
  }

  function showCommand(sw, act) {
    lit[sw] = act === "on";
    var b = bulbs[sw];
    b.classList.remove("lit");
    void b.getBoundingClientRect();
    if (lit[sw]) b.classList.add("lit");
    var t = new Date().toLocaleTimeString("ko-KR", { hour: "numeric", minute: "2-digit", hour12: false });
    $("last" + sw).textContent = "마지막 명령: " + (act === "on" ? "켜기" : "끄기") + " (" + t + ")";
    updateLitFlag();
  }

  if (!navigator.bluetooth) {
    connectBtn.disabled = true;
    allBtn.hidden = true;
    setStatus("이 브라우저는 웹 블루투스를 지원하지 않아요. 아이폰에서는 Bluefy 앱으로 열어주세요.", true);
    return;
  }

  function withTimeout(p, ms, label) {
    return Promise.race([p, new Promise(function (_, rej) {
      setTimeout(function () {
        var e = new Error(label + " 응답 없음 (" + (ms / 1000) + "초)");
        e.name = "TimeoutError";
        rej(e);
      }, ms);
    })]);
  }

  async function openGatt() {
    log("1/3 기기에 연결 요청");
    var server = await withTimeout(device.gatt.connect(), 10000, "기기 연결");
    log("1/3 기기 연결됨");
    log("2/3 서비스 찾는 중");
    var svc = await withTimeout(server.getPrimaryService(SERVICE), 10000, "서비스 찾기");
    log("2/3 서비스 찾음");
    log("3/3 특성 찾는 중");
    try {
      ch = await withTimeout(svc.getCharacteristic(CHAR), 10000, "특성 찾기");
    } catch (e) {
      var all = await withTimeout(svc.getCharacteristics(), 10000, "특성 목록");
      if (!all.length) throw e;
      ch = all[all.length - 1];
      log("기본 특성을 못 찾아 마지막 특성을 사용: " + ch.uuid);
    }
    log("3/3 특성 찾음. 연결 완료");
  }

  async function openWithRetry() {
    var last;
    for (var i = 1; i <= 5; i++) {
      try { await openGatt(); return; }
      catch (e) {
        last = e;
        log("연결 시도 " + i + "/5 실패: " + (e && e.name ? e.name + " - " : "") + (e && e.message ? e.message : e));
        try { if (device.gatt.connected) device.gatt.disconnect(); } catch (x) {}
        await new Promise(function (r) { setTimeout(r, 1000); });
      }
    }
    throw last;
  }

  function onDisconnected() {
    log("연결이 끊어졌어요");
    ch = null;
    setConnected(false);
    setStatus("연결이 끊어졌어요. 버튼을 누르면 다시 연결해요.");
  }

  async function connect(showAll) {
    var opts = showAll
      ? { acceptAllDevices: true, optionalServices: [SERVICE] }
      : { filters: [{ namePrefix: "SWITCHER" }], optionalServices: [SERVICE] };
    try {
      busy = true; setControls(false); connectBtn.disabled = true;
      setStatus("기기를 고르세요.");
      var picked = await navigator.bluetooth.requestDevice(opts);
      if (device && device !== picked) {
        device.removeEventListener("gattserverdisconnected", onDisconnected);
      }
      device = picked;
      device.removeEventListener("gattserverdisconnected", onDisconnected);
      device.addEventListener("gattserverdisconnected", onDisconnected);
      log("선택한 기기: " + (device.name || "이름 없음"));
      setStatus("연결 중이에요… (최대 5번 시도해요)");
      await openWithRetry();
      busy = false;
      setConnected(true);
      setStatus("연결됐어요! 이제 불을 켜고 꺼보세요.");
    } catch (e) {
      busy = false;
      log("연결 실패: " + (e && e.message ? e.message : e));
      setConnected(false);
      if (e && e.name === "NotFoundError") {
        setStatus("기기를 고르지 않았어요. 스위처 가까이에서 다시 시도하세요.");
      } else {
        setStatus("연결하지 못했어요: " + (e && e.name ? e.name + " - " : "") + (e && e.message ? e.message : e), true);
      }
    } finally {
      connectBtn.disabled = false;
    }
  }

  connectBtn.addEventListener("click", function () { connect(false); });
  allBtn.addEventListener("click", function () { connect(true); });

  async function write(value) {
    var data = new Uint8Array([value]);
    var props = ch.properties || {};
    if (props.write && ch.writeValueWithResponse) {
      await ch.writeValueWithResponse(data);
    } else if (props.writeWithoutResponse && ch.writeValueWithoutResponse) {
      await ch.writeValueWithoutResponse(data);
    } else {
      await ch.writeValue(data);
    }
  }

  async function send(sw, act, btn) {
    if (!device) { setStatus("먼저 스위처를 연결하세요.", true); return; }
    var real = act;
    if (invertEl.checked) real = act === "on" ? "off" : "on";
    var value = KEYS[sw][real];
    busy = true; setControls(false);
    try {
      if (!device.gatt.connected || !ch) { setStatus("다시 연결 중이에요…"); await openGatt(); }
      var tries = 2, lastErr;
      while (tries-- > 0) {
        try {
          await write(value);
          lastErr = null;
          break;
        } catch (e) {
          lastErr = e;
          log("전송 재시도: " + (e && e.message ? e.message : e));
          if (!device.gatt.connected) await openGatt();
        }
      }
      if (lastErr) throw lastErr;
      log("스위치 " + sw + " " + (act === "on" ? "켜기" : "끄기") + " 전송 (값 0x" + value.toString(16).padStart(2, "0") + ")");
      setStatus("스위치 " + sw + " " + (act === "on" ? "켜기" : "끄기") + " 명령을 보냈어요!");
      showCommand(sw, act);
      btn.classList.add("sent");
      setTimeout(function () { btn.classList.remove("sent"); }, 350);
    } catch (e) {
      log("전송 실패: " + (e && e.message ? e.message : e));
      setStatus("명령을 보내지 못했어요. 스위처 가까이에서 연결 버튼을 다시 누르세요.", true);
    } finally {
      busy = false;
      setControls(!!device && !!device.gatt && device.gatt.connected);
    }
  }

  halves.forEach(function (b) {
    b.addEventListener("click", function () {
      send(Number(b.getAttribute("data-sw")), b.getAttribute("data-act"), b);
    });
  });
})();
</script>
</body>
</html>
